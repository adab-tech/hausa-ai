app = "hausa-ai-backend"
primary_region = "jnb"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  OLLAMA_HOST = "http://localhost:11434"
  OLLAMA_MODEL = "aya-expanse:8b"
  OLLAMA_MODELS = "/app/data/ollama-models"
  # Pinned explicitly (matches Ollama's built-in default) so a future Ollama
  # upgrade can't silently shrink it out from under SOVEREIGN_CONSTITUTION —
  # measured at ~950-1050 tokens alone, before history/memoryPrompt/corrections
  # are added, so context length must stay well above that headroom.
  OLLAMA_CONTEXT_LENGTH = "4096"
  # Quantized KV cache (q8_0: ~half the f16 memory footprint, published
  # perplexity delta of 0.002-0.05 — not audibly/legibly different in chat use).
  # Deliberately NOT q4_0: this app's whole point is correctness of gendered
  # Hausa grammar and diacritics, so we take the safer of the two options the
  # guide offers. Flash attention must be on for the KV cache type to take
  # effect; on this CPU-only box its own speed benefit is unproven (it's
  # primarily a GPU optimization) but it's required as a precondition and is
  # not known to hurt CPU inference.
  OLLAMA_FLASH_ATTENTION = "1"
  OLLAMA_KV_CACHE_TYPE = "q8_0"
  # Let the TRAINED model speak naturally — do NOT crank these to force melody
  # onto all speech (intonation varies per sentence and is its own retraining
  # methodology, not a dial). noise_scale stays at the model's trained default
  # (0.667, so this override is omitted); noise_w 0.3 only trims duration jitter
  # for steady, professional rhythm. Chasing melody at 0.85 introduced tremble.
  VITS_NOISE_W = "0.3"
  # TTS loudness: the landing samples sit at ~-13.6 dBFS RMS. Match them (was
  # -14) and nudge slightly louder so the VITS synthesis, which reads thinner
  # than the human landing recordings at equal RMS, is perceptually on par in
  # conversation. Peak stays limited at -0.5 dBFS (no clipping).
  TTS_TARGET_RMS_DBFS = "-13.0"
  # Counterweight to the low noise_w above: flattening duration variance
  # also quickened delivery ("talking faster than normal" per founder's
  # ear). length_scale > 1 stretches phoneme durations back to a natural
  # pace; still overridable per-request via /api/tts?length_scale=.
  # 1.25 = the "measured" pace chosen by ear against 1.1 and 1.4 — modern-TTS
  # cadence without dragging. Paired with per-sentence pauses (see
  # audio.py VITS_SENTENCE_PAUSE_MS) so speech also breathes at punctuation.
  VITS_LENGTH_SCALE = "1.25"
  # STT quality: "small" recognizes Hausa (and its dialect variation)
  # markedly better than the code-default "base" — the single biggest
  # available lever for "it doesn't understand me" complaints. Costs more
  # CPU per 2s chunk on this 2-vCPU box; if live-voice replies start
  # lagging noticeably, revert to "base".
  WHISPER_MODEL = "small"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "performance-2x"
  memory = "8gb"

[mounts]
  source = "hausa_ai_data"
  destination = "/app/data"
