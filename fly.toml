app = "hausa-ai-backend"
primary_region = "jnb"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  OLLAMA_HOST = "http://localhost:11434"
  OLLAMA_MODEL = "aya-expanse:8b"
  OLLAMA_MODELS = "/app/data/ollama-models"
  # Pinned explicitly (matches Ollama's built-in default) so a future Ollama
  # upgrade can't silently shrink it out from under SOVEREIGN_CONSTITUTION —
  # measured at ~950-1050 tokens alone, before history/memoryPrompt/corrections
  # are added, so context length must stay well above that headroom.
  OLLAMA_CONTEXT_LENGTH = "4096"
  # Quantized KV cache (q8_0: ~half the f16 memory footprint, published
  # perplexity delta of 0.002-0.05 — not audibly/legibly different in chat use).
  # Deliberately NOT q4_0: this app's whole point is correctness of gendered
  # Hausa grammar and diacritics, so we take the safer of the two options the
  # guide offers. Flash attention must be on for the KV cache type to take
  # effect; on this CPU-only box its own speed benefit is unproven (it's
  # primarily a GPU optimization) but it's required as a precondition and is
  # not known to hurt CPU inference.
  OLLAMA_FLASH_ATTENTION = "1"
  OLLAMA_KV_CACHE_TYPE = "q8_0"
  # Lower than the model config's baked-in 0.8 -- reduces per-phoneme
  # duration jitter from the VITS duration predictor, which is what was
  # producing uneven/erratic speech rhythm. Confirmed by ear against 0.8
  # and 0.5 (see services/vits_engine.py's VITS_NOISE_W override).
  VITS_NOISE_W = "0.3"
  # Counterweight to the low noise_w above: flattening duration variance
  # also quickened delivery ("talking faster than normal" per founder's
  # ear). length_scale > 1 stretches phoneme durations back to a natural
  # pace; still overridable per-request via /api/tts?length_scale=.
  VITS_LENGTH_SCALE = "1.1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "performance-2x"
  memory = "8gb"

[mounts]
  source = "hausa_ai_data"
  destination = "/app/data"
