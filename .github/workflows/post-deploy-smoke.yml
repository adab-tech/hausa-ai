name: Post Deploy Smoke Test

on:
  workflow_run:
    workflows: ["Deploy Cloud Run (adabtech)"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test deployed service
    # Only the branch/conclusion check lives in the job-level `if:` --
    # secrets.* evaluated there against a workflow_run event was showing as
    # a hard failure ("likely failed because of a workflow file issue")
    # instead of a clean skip, even though Cloud Run deploy being dormant
    # (no GCP_WIF_PROVIDER/GCP_SERVICE_ACCOUNT configured) is expected and
    # intentional -- see docs/deployment.md. The secrets check moves into a
    # step below instead, which evaluates them reliably.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    env:
      SERVICE_URL: https://adabtech-1015422054034.europe-west1.run.app

    steps:
      - name: Check Cloud Run deploy is actually configured
        id: gate
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloud Run deploy secrets not configured -- this deployment path is dormant by design (see docs/deployment.md). Skipping smoke test, not failing."
          fi

      - name: Check health endpoint
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS --retry 6 --retry-all-errors --retry-delay 10 --max-time 30 "$SERVICE_URL/health")
          echo "Health response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status"'
          echo "$RESPONSE" | grep -q '"sovereign"'
          echo "$RESPONSE" | grep -q '"version"'

      - name: Summary
        if: steps.gate.outputs.configured == 'true'
        run: |
          echo "Smoke test passed for $SERVICE_URL"
