name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Lint & type-check (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        continue-on-error: true
        run: ruff format --check .

      - name: Mypy type check
        working-directory: backend
        continue-on-error: true
        run: mypy .

  test:
    name: Test & coverage (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install runtime dependencies (lightweight stubs only)
        working-directory: backend
        # Install only the FastAPI / Pydantic stack for unit tests, plus the
        # handful of lazy-imported packages routers/image.py actually touches
        # at import time even when their calls are mocked (google-genai,
        # imageio); torch / diffusers proper are mocked and not installed.
        run: |
          pip install \
            fastapi~=0.115.0 \
            "uvicorn[standard]~=0.30.0" \
            "httpx>=0.27,<1" \
            python-multipart~=0.0.9 \
            "websockets>=12,<17" \
            ollama~=0.3.0 \
            numpy~=1.26 \
            Pillow~=10.4.0 \
            google-auth>=2.30.0 \
            google-genai>=1.0.0 \
            imageio>=2.34.0 \
            imageio-ffmpeg>=0.5.0 \
            "bcrypt>=4.0,<5" \
            "slowapi>=0.1.9,<1" \
            requests>=2.31.0

      - name: Install dev/test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest --cov=. \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=60 \
                 -v

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30
