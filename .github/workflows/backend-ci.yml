name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Lint & type-check (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dev dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        continue-on-error: true
        run: ruff format --check .

      - name: Mypy type check
        working-directory: backend
        continue-on-error: true
        run: mypy .

  test:
    name: Test & coverage (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install runtime dependencies (lightweight stubs only)
        working-directory: backend
        # Install only the FastAPI / Pydantic stack for unit tests, plus the
        # handful of lazy-imported packages routers/image.py actually touches
        # at import time even when their calls are mocked (google-genai,
        # imageio); torch / diffusers proper are mocked and not installed.
        #
        # This list is hand-maintained separately from requirements.txt and
        # WILL go stale again -- every package imported at MODULE level
        # (not lazily inside a function, the way unicodedata2/epitran are)
        # needs to be added here too, or collection fails on every test
        # file that transitively imports routers/__init__.py. Found the
        # hard way 2026-08-24: orjson and sentry-sdk (both added to
        # requirements.txt as top-level imports the same day) broke this
        # job while local `pytest` stayed green, because the local dev venv
        # happened to already have them installed from earlier `pip
        # install` testing -- CI has no such incidental coverage.
        run: |
          pip install \
            fastapi~=0.115.0 \
            "starlette>=1.3.1,<2" \
            "uvicorn[standard]~=0.30.0" \
            "httpx>=0.27,<1" \
            "python-multipart>=0.0.31,<1" \
            "websockets>=12,<17" \
            ollama~=0.3.0 \
            numpy~=1.26 \
            "Pillow>=12.3,<13" \
            google-auth>=2.30.0 \
            "cryptography>=50.0.0,<51" \
            google-genai>=1.0.0 \
            imageio>=2.34.0 \
            imageio-ffmpeg>=0.5.0 \
            "bcrypt>=4.0,<5" \
            "slowapi>=0.1.9,<1" \
            requests>=2.31.0 \
            "orjson>=3.10,<4" \
            "cachetools>=5.5,<6" \
            "tenacity>=9.0,<10" \
            "sentry-sdk[fastapi]>=2.0,<3" \
            "onnxruntime>=1.18,<2" \
            "piper-tts~=1.2.0"

      - name: Install dev/test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest --cov=. \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=60 \
                 -v

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30
