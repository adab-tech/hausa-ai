[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length — handled by formatter
    "W293",  # blank line contains whitespace
    "F841",  # unused local variables (exc, e, etc.)
    "F401",  # unused imports (os, List, etc.)
    "B905",  # zip() without strict= parameter
    "E402",  # module level import not at top of file
    "B007",  # loop control variable not used within loop body
]

[tool.ruff.lint.isort]
known-first-party = ["routers", "auth"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("don't call a function in an argument default") is a real footgun
# for a genuinely mutable default, but FastAPI's own dependency-injection
# system is built on exactly this pattern -- File(...)/Form(...)/Body(...)/
# etc. are inert sentinel markers FastAPI reads via introspection, never
# actually evaluated as Python default values at call time. Ruff's bugbear
# already special-cases fastapi.Depends/fastapi.Query out of the box
# (confirmed: neither ever triggers B008 anywhere in this codebase); the
# rest of the same family needs the same treatment or every admin
# multipart-upload route trips a false positive.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
files = ["main.py", "auth.py", "routers/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=60"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = ["tests/*"]
